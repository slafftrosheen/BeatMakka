</style></head><body>
<div class="caption">ALPHA 01 · дизайн-прототип · исходные звуки проекта · сохранение только в этом браузере</div>
<main class="device" aria-label="MK-I groovebox"><header class="brand"><b class="logo">MK-I</b><span class="sub">NEEDLE QUAY / YOUR SOUND</span><span class="status" id="saveStatus">BROWSER ONLY</span></header>
<div class="patterns"><div id="slots" class="patterns"></div><label class="tempo"><input id="bpm" type="number" min="60" max="180" value="96" aria-label="Tempo in BPM"> BPM</label><span class="state" id="state" aria-live="polite">READY</span></div>

<div class="transport"><button id="stop">■ STOP</button><button id="play" class="play" aria-pressed="false">▶ PLAY</button><button id="record" class="record" aria-pressed="false">● REC</button><button id="mute" aria-pressed="false" aria-label="Master mute">SOUND ON</button><button id="save">SAVE</button></div>

<div class="caption">1–4 · QWER · ASDF · ZXCV — пэды &nbsp; / &nbsp; Space — play · R — pad 08</div>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"></div><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const SAMPLES=__SAMPLES_JSON__;
const keys=['1','2','3','4','q','w','e','r','a','s','d','f','z','x','c','v'];
const defaults=SAMPLES.slice(0,16).map(s=>s.id);const byId=Object.fromEntries(SAMPLES.map(s=>[s.id,s]));
const $=id=>document.getElementById(id);const clone=x=>JSON.parse(JSON.stringify(x));
function fresh(){return {bpm:96,assign:[...defaults],muted:Array(16).fill(false),notes:Array.from({length:16},()=>Array(16).fill(false))}}
let patterns=Array.from({length:4},fresh),slot=0,selected=0,view='PLAY',chosenSound=defaults[0],shelfIndex=0,shelf=Array(6).fill(null),dirty=false;
let running=false,recording=false,masterMuted=false,step=-1,nextStep=0,nextTime=0,startTime=0,clockId=null,visualTimers=[],pending=null,modalFocus=null;
let ctx,output,readyPromise;const buffers={},pointers=new Map(),heldKeys=new Set(),voices=new Set(),flashes=Array(16).fill(0);
const p=()=>patterns[slot];
try{const saved=JSON.parse(localStorage.getItem('beatmakka-design-shelf-v1'));if(Array.isArray(saved)&&saved.length===6&&saved.every(x=>x===null||(Array.isArray(x)&&x.length===4&&x.every(y=>Number.isFinite(y.bpm)&&y.bpm>=60&&y.bpm<=180&&Array.isArray(y.assign)&&y.assign.length===16&&y.assign.every(a=>byId[a])&&Array.isArray(y.muted)&&y.muted.length===16&&y.muted.every(a=>typeof a==='boolean')&&Array.isArray(y.notes)&&y.notes.length===16&&y.notes.every(r=>Array.isArray(r)&&r.length===16&&r.every(a=>typeof a==='boolean'))))))shelf=saved}catch(e){}
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
async function audio(){if(!ctx){ctx=new AudioContext();output=ctx.createGain();output.gain.value=masterMuted?0:.65;output.connect(ctx.destination);readyPromise=Promise.all(SAMPLES.map(async s=>{const bytes=Uint8Array.from(atob(s.data),c=>c.charCodeAt(0));buffers[s.id]=await ctx.decodeAudioData(bytes.buffer)})).catch(e=>{toast('Не удалось открыть звук в браузере');throw e})}await ctx.resume();await readyPromise}
function sound(id,time){if(!buffers[id]||!ctx)return;const source=ctx.createBufferSource();source.buffer=buffers[id];source.connect(output);voices.add(source);source.onended=()=>voices.delete(source);source.start(time||ctx.currentTime)}
function silence(){for(const voice of voices){try{voice.stop()}catch(e){}}voices.clear()}
function changed(){dirty=true;cancelPending();status()}
function status(){$('saveStatus').textContent=dirty?'UNSAVED CHANGES':'BROWSER ONLY';$('state').textContent=recording?'● RECORDING':running?'▶ PLAYING':'READY';$('record').setAttribute('aria-pressed',recording);$('play').setAttribute('aria-pressed',running);$('bpm').value=p().bpm}
function updatePads(){[...$('pads').children].forEach((b,i)=>{b.classList.toggle('chosen',i===selected);b.classList.toggle('muted',p().muted[i]);b.setAttribute('aria-label',`Pad ${i+1}: ${byId[p().assign[i]].label}${p().muted[i]?', muted':''}`);b.querySelector('b').textContent=p().assign[i]==='tambourine'?'Tamb.':byId[p().assign[i]].label;b.querySelector('b').dataset.short=({closed_hat:'CH',open_hat:'OH',low_tom:'LT',high_tom:'HT',shaker:'Shak',tambourine:'Tamb',bass_c:'C',bass_eb:'Eb',bass_g:'G',metal_hit:'Metal',robot_chirp:'Chirp',chord:'Chord'})[p().assign[i]]||byId[p().assign[i]].label;b.querySelector('.key').textContent=p().muted[i]?'MUTED':keys[i].toUpperCase()})}
function flash(i){const b=$('pads').children[i];clearTimeout(flashes[i]);b.classList.add('hit');flashes[i]=setTimeout(()=>b.classList.remove('hit'),110)}
async function hit(i){selected=i;updatePads();render();await audio();if(!p().muted[i])sound(p().assign[i]);flash(i);if(recording&&running){const at=((Math.round((ctx.currentTime-startTime)/(60/p().bpm/4))%16)+16)%16;p().notes[i][at]=true;changed();render()}}
function stop(){running=false;recording=false;clearInterval(clockId);visualTimers.forEach(t=>clearTimeout(t.id));visualTimers=[];silence();step=-1;status();render()}
function scheduler(){const dur=60/p().bpm/4;while(running&&nextTime<ctx.currentTime+.075){const s=nextStep,at=nextTime;for(let i=0;i<16;i++)if(p().notes[i][s]&&!p().muted[i])sound(p().assign[i],at);visualTimers=visualTimers.filter(t=>t.active);const timer={active:true};timer.id=setTimeout(()=>{timer.active=false;if(!running)return;step=s;for(let i=0;i<16;i++)if(p().notes[i][s]&&!p().muted[i])flash(i);playhead()},Math.max(0,(at-ctx.currentTime)*1000));visualTimers.push(timer);nextStep=(nextStep+1)%16;nextTime+=dur}}
async function play(){await audio();if(running)return;running=true;startTime=ctx.currentTime+.04;nextTime=startTime;nextStep=0;clockId=setInterval(scheduler,12);scheduler();status()}
function playhead(){document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('now',Number(e.dataset.step)===step))}
function cancelPending(){pending=null;if(!$('modal').classList.contains('hidden'))closeDialog()}
function showDialog(title,text,confirm){modalFocus=document.activeElement;$('modal').innerHTML=`<div class="dialog"><h2 id="dialogTitle">${title}</h2><p>${text}</p><div class="actions"><button id="cancelAction">CANCEL</button><button class="play" id="confirmAction">CONFIRM</button></div></div>`;$('modal').classList.remove('hidden');$('cancelAction').onclick=cancelPending;$('confirmAction').onclick=confirm;$('cancelAction').focus()}
function closeDialog(){$('modal').classList.add('hidden');if(modalFocus&&modalFocus.isConnected)modalFocus.focus()}
function confirmAction(kind,action){cancelPending();pending={kind,slot,index:shelfIndex,expires:Date.now()+5000};const expected=pending;showDialog(kind==='SAVE'?'Заменить сохранённый бит?':'Загрузить бит?',kind==='SAVE'?'Будут заменены все четыре паттерна выбранного места. Подтверждение действует 5 секунд.':'Все четыре рабочих паттерна будут заменены. Воспроизведение остановится. Подтверждение действует 5 секунд.',()=>{if(pending!==expected||Date.now()>expected.expires){cancelPending();toast('Подтверждение истекло');return}pending=null;closeDialog();action()});setTimeout(()=>{if(pending===expected){cancelPending();toast('Подтверждение истекло')}},5000)}
function saveShelf(){const index=shelfIndex;const act=()=>{const proposed=clone(shelf);proposed[index]=clone(patterns);try{localStorage.setItem('beatmakka-design-shelf-v1',JSON.stringify(proposed));shelf=proposed;dirty=false;status();render();toast('Сохранено в этом браузере · Beat '+(index+1))}catch(e){toast('Сохранение недоступно. Правки остаются открытыми.')}};if(shelf[index])confirmAction('SAVE',act);else act()}
function loadShelf(){if(!shelf[shelfIndex])return;const index=shelfIndex;confirmAction('LOAD',()=>{stop();patterns=clone(shelf[index]);dirty=false;slot=0;updateSlots();updatePads();status();render();toast('Бит открыт из локальной полки')})}
function updateSlots(){[...$('slots').children].forEach((b,i)=>b.setAttribute('aria-pressed',i===slot))}
function render(){[...$('tabs').children].forEach(b=>b.classList.toggle('selected',b.textContent===view));$('main').classList.toggle('library',view==='SOUNDS'||view==='BEATS');$('main').classList.toggle('editor',view==='STEPS');const name=byId[p().assign[selected]].label;let html=`<p class="eyebrow">PAD ${String(selected+1).padStart(2,'0')} / ${view}</p>`;
if(view==='PLAY'){html+=`<h1 class="soundname">${name}</h1><div class="wave" aria-hidden="true">${Array.from({length:32},(_,i)=>`<i style="height:${12+Math.abs(Math.sin(i*1.1)*Math.cos(i*.21))*85}%"></i>`).join('')}</div><div class="timeline">${p().notes[selected].map((v,i)=>`<span data-step="${i}" class="${v?'on':''}"></span>`).join('')}</div><p class="hint">Tap a pad. Build something yours.</p>`}
if(view==='STEPS'){html+=`<div class="steps">${p().notes[selected].map((v,i)=>`<button data-step="${i}" aria-label="Step ${i+1}" aria-pressed="${v}">${String(i+1).padStart(2,'0')} <span>${v?'ON':'OFF'}</span></button>`).join('')}</div><div class="actions"><button id="clearPad" class="danger">CLEAR PAD</button><button id="mutePad" aria-pressed="${p().muted[selected]}">${p().muted[selected]?'UNMUTE':'MUTE'} PAD</button></div>`}
if(view==='SOUNDS'){html+=`<div class="list">${SAMPLES.map(s=>`<button data-sound="${s.id}" class="${chosenSound===s.id?'selected':''}">${s.label}<small>${s.discovery?'DISCOVERY DEMO':'STARTER'}</small></button>`).join('')}</div><div class="actions"><button id="preview">PREVIEW</button><button id="assign" class="play">ASSIGN TO PAD</button><button id="backPlay">BACK</button></div>`}
if(view==='BEATS'){html+=`<div class="shelf">${shelf.map((s,i)=>`<button data-shelf="${i}" class="${shelfIndex===i?'selected':''}">Beat ${String(i+1).padStart(2,'0')}<small>${s?'4 PATTERNS / LOCAL':'EMPTY'}</small></button>`).join('')}</div><div class="actions"><button id="saveShelf">SAVE TO SHELF</button><button id="loadShelf" class="play" ${shelf[shelfIndex]?'':'disabled'}>LOAD BEAT</button><button id="backPlay">BACK</button></div>`}
$('content').innerHTML=html;playhead();if($('backPlay'))$('backPlay').onclick=()=>{cancelPending();view='PLAY';render()};
document.querySelectorAll('.steps [data-step]').forEach(b=>b.onclick=()=>{const n=Number(b.dataset.step);p().notes[selected][n]=!p().notes[selected][n];changed();render()});
if($('clearPad'))$('clearPad').onclick=()=>confirmAction('CLEAR',()=>{p().notes[selected].fill(false);changed();render()});
if($('mutePad'))$('mutePad').onclick=()=>{p().muted[selected]=!p().muted[selected];changed();updatePads();render()};
document.querySelectorAll('[data-sound]').forEach(b=>b.onclick=()=>{chosenSound=b.dataset.sound;document.querySelectorAll('[data-sound]').forEach(x=>x.classList.toggle('selected',x===b))});
if($('preview'))$('preview').onclick=async()=>{await audio();sound(chosenSound)};if($('assign'))$('assign').onclick=()=>{p().assign[selected]=chosenSound;changed();updatePads();render();toast('Звук назначен пэду '+(selected+1))};
document.querySelectorAll('[data-shelf]').forEach(b=>b.onclick=()=>{cancelPending();shelfIndex=Number(b.dataset.shelf);render()});if($('saveShelf'))$('saveShelf').onclick=saveShelf;if($('loadShelf'))$('loadShelf').onclick=loadShelf;
}
keys.forEach((key,i)=>{const b=document.createElement('button');b.className='pad';b.innerHTML=`<span class="num">${String(i+1).padStart(2,'0')}</span><b></b><span class="key"></span>`;b.onpointerdown=e=>{if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();pointers.set(e.pointerId,i);b.setPointerCapture(e.pointerId);hit(i).catch(()=>{})};b.onpointerup=b.onpointercancel=e=>{pointers.delete(e.pointerId)};b.onclick=e=>{if(e.detail===0)hit(i).catch(()=>{})};$('pads').append(b)});
['A','B','C','D'].forEach((label,i)=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{cancelPending();stop();slot=i;updateSlots();updatePads();status();render()};$('slots').append(b)});
['PLAY','STEPS','SOUNDS','BEATS'].forEach(label=>{const b=document.createElement('button');b.textContent=label;b.onclick=()=>{cancelPending();view=label;render()};$('tabs').append(b)});
